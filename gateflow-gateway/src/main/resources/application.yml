server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: gateflow-gateway
  r2dbc:
    url: r2dbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:gateflow_db}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    properties:
      sslMode: DISABLED
      useServerPrepareStatement: true
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
