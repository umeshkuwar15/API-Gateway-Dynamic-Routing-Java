<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' — GateFlow API Gateway'">GateFlow API Gateway</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/gateflow.css}">
</head>
<body>

<aside th:fragment="sidebar(activeMenu)" class="gateflow-sidebar">
    <div class="sidebar-brand">
        <div class="brand-icon">
            <i class="bi bi-shuffle"></i>
        </div>
        <div class="brand-text">
            <h4>GateFlow</h4>
            <small>Dynamic Routing</small>
        </div>
    </div>

    <div class="sidebar-menu">
        <div class="menu-category">Main Control</div>
        <a th:href="@{/}" class="nav-link-item" th:classappend="${activeMenu == 'dashboard'} ? 'active' : ''">
            <i class="bi bi-grid-1x2-fill"></i>
            <span>Dashboard</span>
        </a>

        <div class="menu-category">Routing Engine</div>
        <a th:href="@{/routes}" class="nav-link-item" th:classappend="${activeMenu == 'routes'} ? 'active' : ''">
            <i class="bi bi-signpost-split-fill"></i>
            <span>Route Management</span>
        </a>
        <a th:href="@{/services}" class="nav-link-item" th:classappend="${activeMenu == 'services'} ? 'active' : ''">
            <i class="bi bi-hdd-network-fill"></i>
            <span>Service Registry</span>
        </a>

        <div class="menu-category">Observability</div>
        <a th:href="@{/tester}" class="nav-link-item" th:classappend="${activeMenu == 'tester'} ? 'active' : ''">
            <i class="bi bi-send-fill"></i>
            <span>API Tester</span>
        </a>
        <a th:href="@{/logs}" class="nav-link-item" th:classappend="${activeMenu == 'logs'} ? 'active' : ''">
            <i class="bi bi-journal-text"></i>
            <span>Request Logs</span>
        </a>
    </div>

    <div class="sidebar-footer">
        <div class="d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-2">
                <div class="rounded-circle bg-secondary d-flex align-items-center justify-content-center text-white" style="width: 32px; height: 32px; font-size: 13px;">
                    <i class="bi bi-person-fill"></i>
                </div>
                <div>
                    <div style="font-size: 13px; font-weight: 600; color: #f8fafc;">admin</div>
                    <div style="font-size: 11px; color: #94a3b8;">Administrator</div>
                </div>
            </div>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-sm text-danger p-0" title="Sign Out">
                    <i class="bi bi-box-arrow-right fs-5"></i>
                </button>
            </form>
        </div>
    </div>
</aside>

<header th:fragment="navbar(pageTitle)" class="gateflow-navbar">
    <div class="page-title">
        <h3 th:text="${pageTitle}">Dashboard</h3>
    </div>
    <div class="navbar-actions">
        <div class="status-indicator-pill">
            <span class="status-dot"></span>
            <span>Gateway Online : 8080</span>
        </div>
    </div>
</header>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/gateflow.js}"></script>
</div>

</body>
</html>
