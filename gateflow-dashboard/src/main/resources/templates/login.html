<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — GateFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/gateflow.css}">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 10% 20%, rgb(15, 23, 42) 0%, rgb(2, 6, 23) 90.2%);
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            color: #ffffff;
        }
        .form-control-dark {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border-radius: 8px;
            padding: 12px 16px;
        }
        .form-control-dark:focus {
            background: rgba(15, 23, 42, 0.95);
            border-color: #3b82f6;
            color: #ffffff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body class="login-page">

<div class="login-card">
    <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-3" style="width: 54px; height: 54px; font-size: 26px;">
            <i class="bi bi-shuffle"></i>
        </div>
        <h3 class="fw-bold mb-1">GateFlow Admin</h3>
        <p class="text-secondary small">API Gateway with Dynamic Routing</p>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger py-2 px-3 small border-0 mb-3" role="alert">
        <i class="bi bi-exclamation-circle-fill me-1"></i>
        <span th:text="${errorMessage}">Invalid credentials</span>
    </div>
    <div th:if="${logoutMessage}" class="alert alert-success py-2 px-3 small border-0 mb-3" role="alert">
        <i class="bi bi-check-circle-fill me-1"></i>
        <span th:text="${logoutMessage}">Logged out</span>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label small fw-semibold text-light">Username</label>
            <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-person"></i></span>
                <input type="text" name="username" class="form-control form-control-dark" placeholder="Enter admin username" value="admin" required autofocus>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label small fw-semibold text-light">Password</label>
            <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" class="form-control form-control-dark" placeholder="Enter password" value="admin123" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary-gradient w-100 py-2 fs-6 mb-3">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
        </button>

        <div class="text-center">
            <small class="text-secondary" style="font-size: 11.5px;">Default Dev Credentials: <code>admin</code> / <code>admin123</code></small>
        </div>
    </form>
</div>

</body>
</html>
